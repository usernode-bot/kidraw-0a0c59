  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);

  </script>
  <title>Kidraw</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g transform='rotate(45 50 50)'><rect x='38' y='16' width='24' height='52' rx='5' fill='%232563eb'/><rect x='38' y='28' width='24' height='9' fill='white' opacity='.6'/><path d='M38 68h24l-12 16z' fill='%23f2c58a'/></g></svg>">
  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's
       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; npm run build compiles
       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"></script> -->
  <link rel="stylesheet" href="/tailwind.css">
  <link rel="stylesheet" href="/screens.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>

<body class="min-h-screen bg-ground text-fg">
  <!-- Built from the design kit in styles/tailwind-input.css: colour tokens
       that are right in both looks, and components for buttons, fields,
       lists, cards and data states. The real app keeps the kit; CLAUDE.md's
       "## Design" says how. -->
  <!-- (Named in prose on purpose: Tailwind compiles any class-name word in
       these files, comments included, and the starter should ship only the
       components its screen uses.) -->
  <!-- usernode-spec-screens@1: the screens the spec drew, carried over by the platform as this
       first version's starting point. Their styles are in public/screens.css.
       Change them where behaviour needs it; do not redraw them. -->
  <div data-spec-screen="1">
    <div class="app">
    <p class="demo-note" data-usernode-demo-note hidden>Staging demo</p>
    <div class="top"><h1 class="name">Kidraw</h1>
    <div class="acts">
    <button class="btn-secondary" data-undo aria-label="Undo last mark" aria-disabled="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>Undo</button>
    <button class="btn-secondary" data-clear aria-label="Clear board" aria-disabled="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>Clear</button>
    </div></div>
    <div class="board">
    <canvas data-board role="img" aria-label="Blank drawing board"></canvas>
    <p class="hint" data-hint>Pick a crayon and start drawing</p>
    </div>
    <div class="tools">
    <div class="crayons" role="group" aria-label="Crayons">
    <button class="cr" style="background:rgb(var(--red))" aria-label="Red" aria-pressed="false"></button>
    <button class="cr" style="background:rgb(var(--orange))" aria-label="Orange" aria-pressed="false"></button>
    <button class="cr" style="background:rgb(var(--yellow))" aria-label="Yellow" aria-pressed="false"></button>
    <button class="cr" style="background:rgb(var(--green))" aria-label="Green" aria-pressed="false"></button>
    <button class="cr on" style="background:rgb(var(--blue))" aria-label="Blue, selected" aria-pressed="true"></button>
    <button class="cr" style="background:rgb(var(--purple))" aria-label="Purple" aria-pressed="false"></button>
    <button class="cr" style="background:rgb(var(--brown))" aria-label="Brown" aria-pressed="false"></button>
    </div>
    <div class="row"><span class="sl" id="draw-with-label">Draw with</span>
    <div class="seg" role="radiogroup" aria-labelledby="draw-with-label">
    <button class="t on" data-tool="brush" role="radio" aria-checked="true" aria-label="Brush, selected"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4l6 6-8 8-6-6z"/><path d="M6 12c-2 0-3 2-3 4 0 2-1 3-1 4 3 0 7-1 7-5"/></svg></button>
    <button class="t" data-tool="star" role="radio" aria-checked="false" aria-label="Star stamp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></button>
    <button class="t" data-tool="heart" role="radio" aria-checked="false" aria-label="Heart stamp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-8.5-9C2.4 7.6 5 4.5 8 5c2 .3 3.2 1.7 4 3 .8-1.3 2-2.7 4-3 3-.5 5.6 2.6 4.5 6-1.5 4.6-8.5 9-8.5 9z"/></svg></button>
    </div></div>
    <div class="row"><span class="sl" id="size-label">Size</span>
    <div class="dots" role="radiogroup" aria-labelledby="size-label">
    <button class="d" role="radio" aria-checked="false" aria-label="Small"><i style="width:6px;height:6px"></i></button>
    <button class="d" role="radio" aria-checked="false" aria-label="Medium"><i style="width:12px;height:12px"></i></button>
    <button class="d on" role="radio" aria-checked="true" aria-label="Large, selected"><i style="width:20px;height:20px"></i></button>
    <button class="d" role="radio" aria-checked="false" aria-label="Extra large"><i style="width:28px;height:28px"></i></button>
    </div></div>
    <button class="btn-primary" data-save><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>Save picture</button>
    <p class="save-error" data-save-error hidden>Couldn't save the picture. Your drawing is still here. <button class="btn-secondary" type="button" data-retry>Retry</button></p>
    </div>
    </div>
  </div>
  <!-- /usernode-spec-screens@1 -->
  <script src="/app.js" defer></script>
</body>
